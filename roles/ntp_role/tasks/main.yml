---
# tasks file for ntp_role
- name: Create a VPC
  amazon.aws.ec2_vpc_net:
    name: "{{project_name}}-vpc"
    cidr_block: "{{vpc_cidr}}"
    region: "{{region}}"
    tags:
      module: ec2_vpc_net
      this: works
    tenancy: dedicated
  register: vpc
  notify:
    - Create a subnet