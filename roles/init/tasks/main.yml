---
# tasks file for ntp_role
- name: Create a VPC
  amazon.aws.ec2_vpc_net:
    name: "{{project_name}}-vpc"
    cidr_block: "{{vpc_cidr}}"
    region: "{{region}}"
    tags:
      module: ec2_vpc_net
      this: works
    tenancy: default
  register: vpc

- name: Create a subnet
  amazon.aws.ec2_vpc_subnet:
    state: present
    vpc_id: "{{vpc.vpc.id}}"
    cidr: "{{subnet_cidr}}"
    az: "{{region}}a"
    tags:
      Name: "{{project_name}}-subnet"
  register: subnet

- name: Create an Internet gateway
  amazon.aws.ec2_vpc_igw:
    vpc_id: "{{vpc.vpc.id}}"
    state: present
  register: igw

- name: Set up a route table
  amazon.aws.ec2_vpc_route_table:
    vpc_id: "{{vpc.vpc.id}}"
    region: "{{region}}"
    tags:
      Name: "{{project_name}}-rt"
    subnets:
      - "{{subnet.subnet.id}}"
    routes:
      - dest: "{{destination_cidr}}"
        gateway_id: "{{igw.gateway_id}}"
  register: route_table

- name: Create a security group
  amazon.aws.ec2_security_group:
    name: "{{project_name}}-sg"
    description: "Security group for {{project_name}}"
    vpc_id: "{{vpc.vpc.id}}"
    rules:
      - proto: "{{destination_protocol}}"
        ports:
          - "{{destination_port}}"
        cidr_ip: "{{destination_ip}}"
        rule_desc: allow all on port {{destination_port}}
  register: security_group

- name: Create key pair
  ec2_key:
    name: "{{key_name}}"
    region: "{{region}}"
    state: present
  register: keypair

- name: Save private key to file
  copy:
    content: "{{keypair.key.private_key}}"
    dest: "./{{key_name}}.pem"

- name: Fix private key permissions
  file:
    path: "./{{key_name}}.pem"
    mode: '0600'

- name: Create an EC2 instance
  amazon.aws.ec2_instance:
    name: "{{project_name}}-instance"
    key_name: "{{key_name}}"
    vpc_subnet_id: "{{subnet.subnet.id}}"
    instance_type: "{{instance_type}}"
    security_group: "{{security_group.group_id}}"
    network_interfaces:
      - assign_public_ip: true
    image_id: "{{ami}}"
    wait: true
    count: 1
    placement:
      availability_zone: "{{region}}a"
    tags:
      Name: "{{project_name}}-instance"
  register: ec2

- name: Add an instance to the inventory
  add_host:
    name: "{{project_name}}-instance"
    groups: launched
    ansible_user: "{{ec2_user}}"
    ansible_ssh_private_key_file: "./{{key_name}}.pem"
    ansible_host: "{{ec2.instances[0].public_ip_address}}"
  when: ec2.instances is defined

- name: Wait for SSH to become available
  wait_for:
    host: "{{ec2.instances[0].public_ip_address}}"
    port: "{{destination_port}}"
    delay: 10
    timeout: 300
  when: ec2.instances is defined

- name: Wait for the instance
  ansible.builtin.wait_for:
    timeout: 60

- name: Get NTP server list
  ansible.builtin.shell: "curl -fsSL https://www.ntppool.org/zone/{{zone}} | grep server | grep org | head -3 | awk '{print $2}'"
  delegate_to: "{{project_name}}-instance"
  register: ntp_servers
  changed_when: false

- name: Format NTP server list
  ansible.builtin.shell: "printf '%s\\n' {{ ntp_servers.stdout_lines | map('quote') | join(' ') }} | awk 'NF {print \"pool \" $0 \" iburst maxsources 1 nts prefer\"}'"
  delegate_to: "{{project_name}}-instance"
  register: formatted_ntp_servers
  changed_when: false

- name: Install a NTP package
  ansible.builtin.apt:
    name: chrony
    state: present
    update_cache: true
  become: true
  when: ec2.instances is defined
  delegate_to: "{{project_name}}-instance"

- name: Upload the first configuration file
  ansible.builtin.template:
    src: ubuntu-ntp-pools.sources.j2
    dest: "{{ntp_sources_dir}}/ubuntu-ntp-pools.sources"
  become: true
  when: ec2.instances is defined
  delegate_to: "{{project_name}}-instance"

- name: Upload the second configuration file
  ansible.builtin.template:
    src: chrony.conf.j2
    dest: /etc/chrony/chrony.conf
  become: true
  when: ec2.instances is defined
  delegate_to: "{{project_name}}-instance"

- name: Start service
  ansible.builtin.service:
    name: chrony
    state: started
    enabled: true
  when: ec2.instances is defined
  delegate_to: "{{project_name}}-instance"